kube-prometheus-stack:
  grafana:
    enabled: true
    adminPassword: "admin123"
    service:
      type: ClusterIP

  prometheus:
    prometheusSpec:
      retention: 3d
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

  alertmanager:
    enabled: false