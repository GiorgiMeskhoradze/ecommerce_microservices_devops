name: Reusable Build and Push

on: 
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: |
           17
           21
          distribution: 'temurin'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::427064007409:role/github-actions-ecr-push
          aws-region: eu-central-1

      - name: Login to ECR 
        run: |
          aws ecr get-login-password --region eu-central-1 | \
          docker login --username AWS --password-stdin 427064007409.dkr.ecr.eu-central-1.amazonaws.com

      - name: SonarCloud Scan
        working-directory: ${{ inputs.service_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.10.0.2594:sonar \
            -Dsonar.projectKey=GiorgiMeskhoradze_ecommerce_microservices_devops \
            -Dsonar.organization=giorgimeskhoradze \
            -Dsonar.host.url=https://sonarcloud.io
      
      - name: Build and Push Image
        working-directory: ${{ inputs.service_name }}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          mvn compile jib:build \
          -Djib.to.image=427064007409.dkr.ecr.eu-central-1.amazonaws.com/${{ inputs.service_name }}:${{ github.sha }}

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" charts/${{ inputs.service_name }}/values.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/${{ inputs.service_name }}/values.yaml
          git commit -m "ci: update ${{ inputs.service_name }} image tag to ${{ github.sha }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push failed, retrying ($i)..."
            sleep $((RANDOM % 5 + 1))
          done